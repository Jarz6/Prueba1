{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0">Recuperar Contraseña</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted small">Ingresa el correo electrónico asociado a tu cuenta para enviarte un enlace de recuperación con token seguro.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico:</label>
                        <input type="email" name="email" class="form-control" required autofocus>
                    </div>
                    <div class="d-grid mb-2">
                        <button type="submit" class="btn btn-primary">Enviar Enlace</button>
                    </div>
                    <div class="text-center">
                        <a href="{% url 'login' %}" class="text-secondary small">Volver al login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
