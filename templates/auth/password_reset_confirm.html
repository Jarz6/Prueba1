{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0">Establecer Nueva Contraseña</h4>
            </div>
            <div class="card-body p-4">
                {% if validlink %}
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success">Guardar Nueva Contraseña</button>
                        </div>
                    </form>
                {% else %}
                    <div class="alert alert-danger text-center">
                        El enlace de recuperación es inválido o ha expirado.
                    </div>
                    <a href="{% url 'password_reset' %}" class="btn btn-outline-secondary w-100">Solicitar uno nuevo</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
