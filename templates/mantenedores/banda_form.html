{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">{{ titulo }}</h5>
                <a href="{% url 'crear_estilo' %}?next={{ request.path }}" class="btn btn-sm btn-light text-primary fw-bold">+ Nuevo Género</a>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'bandas_lista' %}" class="btn btn-secondary">Volver</a>
                        <button type="submit" class="btn btn-success">Guardar Banda</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
