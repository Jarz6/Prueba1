{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0 fw-bold">+ Nuevo Género / Estilo Musical</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del Género:</label>
                        {{ form.nombre }}
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ next_url }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Género</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
